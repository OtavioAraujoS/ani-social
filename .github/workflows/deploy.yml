name: Deploy to Render

on:
  push:
    branches: ["*"]

jobs:
  verify:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type Check
        run: bun run check:types

  migrate-and-deploy:
    name: Database Migration & Deploy Trigger
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/3-criar-funcionalidade-de-cicd' || github.ref == 'refs/heads/1-implementar-sistema-de-ranking'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify GitHub Secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret is MISSING in GitHub Settings (Settings > Secrets and variables > Actions)!"
            exit 1
          fi
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is MISSING in GitHub Settings!"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Run Database Migrations
        run: bun run db:migrate:prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Trigger Render Deploy Hook
        if: success()
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
